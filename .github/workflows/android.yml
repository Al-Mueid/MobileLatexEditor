
name: Build Mobile LaTeX Editor APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      #- name: Setup Android SDK
        #uses: android-actions/setup-android@v3
       # with:
         # packages: ''


      - name: Setup Android SDK
        uses: android-actions/setup-android@v4


      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android NDK and SDK packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "ndk;27.2.12479018"

      - name: Install Qt for Android
        uses: jurplel/install-qt-action@v4.4.1
              #jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: all_os
          target: android
          arch: android_arm64_v8a
          #aqtversion: '==3.3.0'
          cache: true
          #aqtversion: '==3.1.*'
          aqtversion: '==3.3.0'

     
  #NEW


      - name: Configure project
        run: |
          export ANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/27.2.12479018"

          rm -rf build

          echo "Qt: $QT_ROOT_DIR"
          echo "Qt Host: $QT_HOST_PATH"
          echo "NDK: $ANDROID_NDK_ROOT"

          test -f "$QT_ROOT_DIR/lib/cmake/Qt6/qt.toolchain.cmake"
          test -f "$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so"

          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            # -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$QT_ROOT_DIR/lib/cmake/Qt6/qt.toolchain.cmake" \
            -DQT_HOST_PATH="$QT_HOST_PATH" \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-35







  #END

      - name: Build project
        run: cmake --build build --parallel 2



#test_case
      




      - name: Inspect APK Signature
        shell: bash
        run: |
          set -e

          APK="build/android-build/MobileLatexEditor.apk"

          echo "===== APK FILE ====="
          ls -lh "$APK"

          echo "===== SIGNATURE VERIFICATION ====="
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -n 1)"

          "$APKSIGNER" verify --verbose --print-certs "$APK" || true

          echo "===== ZIP CONTENTS ====="
          unzip -l "$APK" | head -n 30



      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MobileLatexEditor-APK
          path: |
            build/**/*.apk
            build/android-build/**/*.apk
          if-no-files-found: error

  



