name: Build Mobile LaTeX Editor APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK and NDK
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "ndk;27.2.12479018"

      - name: Install aqtinstall
        run: |
          python3 -m pip install "aqtinstall==3.1.21"

      - name: Check Qt Android packages
        run: |
          python3 -m aqt list-qt linux android --spec 6.8.3

      - name: Install Qt for Android
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: linux
          target: android
          arch: android_arm64_v8a
          aqtversion: '==3.1.21'
          cache: true

      - name: Verify Qt installation
        run: |
          echo "QT_ROOT_DIR=${QT_ROOT_DIR}"
          test -d "${QT_ROOT_DIR}"

      - name: Configure project
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${QT_ROOT_DIR}" \
            -DANDROID_SDK_ROOT="${ANDROID_SDK_ROOT}" \
            -DANDROID_NDK_ROOT="${ANDROID_SDK_ROOT}/ndk/27.2.12479018"

      - name: Build project
        run: |
          cmake --build build --parallel 2

      - name: Collect build output
        if: always()
        run: |
          mkdir -p reports

          {
            echo "Mobile LaTeX Editor Build Report"
            echo "Date (UTC):"
            date -u
            echo ""
            echo "Qt root: ${QT_ROOT_DIR:-not-set}"
            echo ""
            echo "Build status: Check GitHub Actions logs"
          } > reports/build-output.txt

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MobileLatexEditor-APK
          path: |
            build/**/*.apk
            build/android-build/**/*.apk
          if-no-files-found: error

      - name: Upload build report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MobileLatexEditor-Build-Report
          path: reports/build-output.txt
          if-no-files-found: warn




