
name: Build Mobile LaTeX Editor APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      #- name: Setup Android SDK
        #uses: android-actions/setup-android@v3
       # with:
         # packages: ''


      - name: Setup Android SDK
        uses: android-actions/setup-android@v4


      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android NDK and SDK packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "ndk;27.2.12479018"

      - name: Install Qt for Android
        uses: jurplel/install-qt-action@v4.4.1
              #jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: all_os
          target: android
          arch: android_arm64_v8a
          #aqtversion: '==3.3.0'
          cache: true
          #aqtversion: '==3.1.*'
          aqtversion: '==3.3.0'

 #     - name: Configure project
 #       run: |
 #         cmake -S . -B build \
 #           -DCMAKE_BUILD_TYPE=Release \
 #           -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
 #           -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
 #           -DANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
      
      - name: Configure project
        run: |
          export ANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/27.2.12479018"

          echo "QT_ROOT_DIR=$QT_ROOT_DIR"
          echo "QT_HOST_PATH=$QT_HOST_PATH"

          find "$QT_ROOT_DIR" -name "Qt6Config.cmake" -o -name "qt.toolchain.cmake"

          test -f "$QT_ROOT_DIR/lib/cmake/Qt6/qt.toolchain.cmake"

          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$QT_ROOT_DIR/lib/cmake/Qt6/qt.toolchain.cmake" \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-35.



      - name: Build project
        run: cmake --build build --parallel 2

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MobileLatexEditor-APK
          path: |
            build/**/*.apk
            build/android-build/**/*.apk
          if-no-files-found: error

  



